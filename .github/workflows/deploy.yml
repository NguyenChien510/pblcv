# CI/CD for the web demo: every push to main that touches the app builds the Docker image, pushes it to
# ghcr.io/<owner>/pblcv-webdemo (free for public repos) and redeploys it on the EC2 host over SSH.
# One-time setup (INSTALL.md section 6): run deploy/ec2-setup.sh on the instance, then in GitHub
# Settings -> Secrets and variables -> Actions add the variables EC2_HOST (the DuckDNS name, which follows the
# instance's IP after a stop/start; EC2_USER only if not "ubuntu") and the secret EC2_SSH_KEY.
# Until EC2_HOST exists the deploy job is skipped and only the image is built.
name: Build and deploy web demo

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - "web_demo.py"
      - "models/**"
      - "data/**"
      - "utils/**"
      - "configs/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-webdemo
  cancel-in-progress: false

env:
  IMAGE_NAME: pblcv-webdemo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the image with torch, BERT and CLIP is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Image name (ghcr.io needs a lower-case owner)
        id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:${{ github.sha }}
            ${{ steps.img.outputs.image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: vars.EC2_HOST != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2 over SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ vars.EC2_HOST }}
          SSH_USER: ${{ vars.EC2_USER || 'ubuntu' }}
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ec2 && chmod 600 ~/.ssh/ec2
          ssh-keyscan -T 20 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Values go over stdin, not the remote command line, so the token never shows up in the server's ps.
          {
            printf 'export IMAGE=%q GHCR_USER=%q GHCR_TOKEN=%q REF=%q\n' "$IMAGE" "$GHCR_USER" "$GHCR_TOKEN" "$GITHUB_SHA"
            cat deploy/remote-deploy.sh
          } | ssh -i ~/.ssh/ec2 -o ServerAliveInterval=30 -o BatchMode=yes "$SSH_USER@$HOST" 'bash -s'
