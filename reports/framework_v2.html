  <rect x="1480" y="420" width="100" height="56" rx="12" fill="#f2a7c3" class="box"/><text x="1530" y="456" text-anchor="middle" class="t i">T<tspan dy="7" class="s">app</tspan></text>
  <rect x="1480" y="570" width="100" height="56" rx="12" fill="#f2a7c3" class="box"/><text x="1530" y="606" text-anchor="middle" class="t i">T<tspan dy="7" class="s">mot</tspan></text>

  <rect x="1950" y="420" width="120" height="56" rx="12" fill="#a9c9ec" class="box"/><text x="2010" y="456" text-anchor="middle" class="t i">V<tspan dy="7" class="s">app</tspan></text>

</g>
<path d="M1584,298 H1946" class="ar" style="marker-start:url(#a)"/>

<text x="1765" y="435" text-anchor="middle" class="t i">λ<tspan dy="7" class="s">app</tspan><tspan dy="-7">·L</tspan><tspan dy="7" class="s">app</tspan></text>

<path d="M1584,598 H1946" class="ar" style="marker-start:url(#a)"/>
<text x="1765" y="585" text-anchor="middle" class="t i">λ<tspan dy="7" class="s">mot</tspan><tspan dy="-7">·L</tspan><tspan dy="7" class="s">mot</tspan></text>

<!-- MIM -->

<text x="1770" y="698" text-anchor="middle" class="s" style="fill:#6a2c91">Information Minimisation, V<tspan dy="6" class="xs">app</tspan><tspan dy="-6"> ⊥ V</tspan><tspan dy="6" class="xs">mot</tspan></text>
<text x="1770" y="724" text-anchor="middle" class="xs i" style="fill:#6a2c91">|cos| of batch-centred embeddings, video side only</text>

<text x="1490" y="838" class="s i">L = L<tspan dy="6" class="xs">joint</tspan><tspan dy="-6"> + λ</tspan><tspan dy="6" class="xs">app</tspan><tspan dy="-6">L</tspan><tspan dy="6" class="xs">app</tspan><tspan dy="-6"> + λ</tspan><tspan dy="6" class="xs">mot</tspan><tspan dy="-6">L</tspan><tspan dy="6" class="xs">mot</tspan><tspan dy="-6"> + λ</tspan><tspan dy="6" class="xs">mim</tspan><tspan dy="-6">L</tspan><tspan dy="6" class="xs">MIM</tspan></text>
<text x="1490" y="890" class="s b">Retrieval score</text>
<text x="1490" y="928" class="s i">s = w<tspan dy="6" class="xs">1</tspan><tspan dy="-6">·cos(T</tspan><tspan dy="6" class="xs">full</tspan><tspan dy="-6">,V</tspan><tspan dy="6" class="xs">video</tspan><tspan dy="-6">) + w</tspan><tspan dy="6" class="xs">2</tspan><tspan dy="-6">·cos(T</tspan><tspan dy="6" class="xs">app</tspan><tspan dy="-6">,V</tspan><tspan dy="6" class="xs">app</tspan><tspan dy="-6">)</tspan></text>
<text x="1520" y="962" class="s i">+ w<tspan dy="6" class="xs">3</tspan><tspan dy="-6">·cos(T</tspan><tspan dy="6" class="xs">mot</tspan><tspan dy="-6">,V</tspan><tspan dy="6" class="xs">mot</tspan><tspan dy="-6">)</tspan><tspan class="xs" font-style="normal">   (w chosen on val)</tspan></text>
