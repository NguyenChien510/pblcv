# Web demo behind Caddy (HTTPS). Run from this folder:  docker compose up -d --build
# Model files stay on the host (../checkpoints, ../yolov8n.pt) and are mounted read-only.
# The app reads its settings from .env (configure-app.sh): Supabase gallery and the /admin password.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    # Local: built from the Dockerfile. EC2 (CI/CD): APP_IMAGE in .env points at the ghcr.io image built by
    # .github/workflows/deploy.yml, which deploy/remote-deploy.sh pulls and starts with --no-build.
    image: ${APP_IMAGE:-pblcv-webdemo:latest}
    restart: unless-stopped
    env_file: .env                 # SUPABASE_URL, SUPABASE_SECRET_KEY, ADMIN_PASSWORD_HASH
    environment:
      TRUST_PROXY: "1"             # only Caddy reaches the app port, so X-Forwarded-For is the visitor's IP
    volumes:
      - ../checkpoints:/app/checkpoints:ro
      - ../yolov8n.pt:/app/yolov8n.pt:ro
      - app_cache:/app/uploads     # local copies of gallery videos survive restarts and deploys
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_cache:
  caddy_data:
  caddy_config:
